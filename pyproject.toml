[project]
name = "pr-lint"
dynamic = ["version"]
description = ""
authors = [
    { name = "lucemia", email = "lucemia@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygithub==2.9.1",
    "typer==0.25.1",
]

[project.scripts]
pr-lint = "pr_lint.main:app"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "syrupy==5.1.0",
    "prek>=0.1",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/pr_lint"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
